[project]
name = "eco331-explainable-inflation-ml"
version = "0.1.0"
description = "ECO331 course project: US CPI inflation prediction with economic models, machine learning and forecast explanations"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "xgboost>=3.2.0",
]
